<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clihtourist Hub · Faggots</title>
<meta name="description" content="Pick a card, meet the crew.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="topbar">
  <a class="brand" href="index.html">
    <span class="brand-badge">🎲</span>
    <span>Clihtourist Hub</span>
  </a>
  <div class="nav-links">
    <a class="btn btn-primary" href="add.html">+ Add your card</a>
  </div>
</nav>

<section class="hero">
  <span class="hero-eyebrow">// select your fighter</span>
  <h1>The <span>whole crew</span>, one roster.</h1>
  <p>A little scrapbook of everyone in the server — pull up a card to see their lore, stats, and chaos level.</p>
</section>

<section class="roster">
  <div class="roster-head">
    <h2>Roster</h2>
    <span class="roster-count mono" id="roster-count">loading…</span>
  </div>

  <div class="filter-row">
    <button class="chip active" data-role="all">Everyone</button>
    <button class="chip" data-role="owner">Owner</button>
    <button class="chip" data-role="mod">Mods</button>
    <button class="chip" data-role="member">Members</button>
  </div>

  <div class="grid" id="grid">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
</section>

<footer>made with 💜 for the server · not affiliated with Discord</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/shared.js"></script>
<script src="js/gallery.js"></script>
</body>
</html>
